services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - forniture-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  forniture:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.3.3}
    image: forniture:${APP_VERSION:-1.3.3}
    container_name: forniture
    restart: unless-stopped
    pull_policy: never
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "30090:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      APP_NAME: "Forniture"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      NODE_ENV: development
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  forniture-db:

services:
  generapp:
    image: ghcr.io/robertoformentin/generapp:1.0.0
    container_name: generapp
    restart: unless-stopped
    ports:
      - "30080:8080"
    environment:
      APP_NAME: "GenerApp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

replicaCount: 1

image:
  repository: ghcr.io/robertoformentin/generapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8080

env:
  - name: APP_NAME
    value: GenerApp

service:
  type: NodePort
  port: 8080
  nodePort: 30080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: generapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

storage:
  enabled: false
  mountPath: /data
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  existingClaim: ""

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

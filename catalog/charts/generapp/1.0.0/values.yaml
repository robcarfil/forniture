replicaCount: 1

image:
  repository: 100.119.243.68:30142/gestore/generapp
  tag: "1.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

containerPort: 3000

env:
  - name: APP_NAME
    value: GenerApp

service:
  type: NodePort
  port: 3000
  nodePort: 30080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: generapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

storage:
  enabled: false
  mountPath: /data
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  existingClaim: ""

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
